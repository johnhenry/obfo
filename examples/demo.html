<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Object form</title>
    <style>
      input[type="image"] {
        width: 64px;
        height: 64px;
      }
    </style>
  </head>
  <body>
    <form id="test-form" data-obfo-container="[]">
      <div data-obfo-container="{}">
        <p data-obfo-value data-obfo-name="description" contenteditable="">
          This is a description
        </p>
        <fieldset>
          <label>
            Pick me
            <input name="pick me" type="radio" data-obfo-cast="checkbox" />
          </label>
        </fieldset>
        <fieldset data-obfo-container="{}" data-obfo-name="name">
          <h2>Name</h2>
          <label
            >Last Name
            <input
              name="last"
              placeholder="Your Last Name"
              value="Doe" /></label
          >,
          <label
            >First Name
            <input name="first" placeholder="Your First Name" value="Jon"
          /></label>
          <label
            >Middle Initial
            <input name="middle" placeholder="Your Middle Initial"
          /></label>
        </fieldset>
        <fieldset>
          <h2>Birthdate</h2>
          <label>
            <input
              name="birthdate"
              type="date"
              placeholder="Apartment"
              value="2000-01-01"
              data-obfo-cast
          /></label>
          <label>
            <input
              name="time"
              type="time"
              placeholder="Apartment"
              value="2000-01-01"
              data-obfo-cast
          /></label>
          <label>
            <input
              name="age"
              type="number"
              placeholder="Apartment"
              min="0"
              value="20"
              max="100"
              data-obfo-cast
          /></label>
        </fieldset>
        <fieldset data-obfo-container="{}" data-obfo-name="address">
          <h2>Address</h2>
          <label
            >Street Number
            <input name="number" placeholder="Street Number" value="1234"
          /></label>
          <label
            >Street Name
            <input name="name" placeholder="Street Name" value="Fake St"
          /></label>
          <label
            >Apartment <input name="apt" placeholder="Apartment " value="A"
          /></label>
        </fieldset>
        <fieldset data-obfo-container="[]" data-obfo-name="media">
          <h2>Media (Hidden)</h2>
          <div><img alt="" /><input type="hidden" value="abc.jpg" /></div>
          <div><img alt="" /><input type="hidden" value="def.jpg" /></div>
          <div><img alt="" /><input type="hidden" value="ghi.jpg" /></div>
        </fieldset>
        <fieldset data-obfo-name="food preferences" data-obfo-container="{}">
          <h2>Meal Preferences</h2>
          <label>
            Vegetarian
            <input
              name="vegetarian"
              type="checkbox"
              data-obfo-cast="checkbox"
            />
          </label>
          <div data-obfo-name="allergies" data-obfo-container="{}">
            <h3>Allergies</h3>
            <label>
              Peanuts
              <input type="checkbox" name="peanuts" data-obfo-cast />
            </label>
            <label>
              Shellfish
              <input type="checkbox" name="shellfish" data-obfo-cast />
            </label>
            <label>
              Dairy
              <input type="checkbox" name="dairy" data-obfo-cast />
            </label>
            <label>
              Gluten
              <input type="checkbox" name="gluten" data-obfo-cast />
            </label>
          </div>
        </fieldset>
        <fieldset>
          <h2>Files</h2>
          <label>
            Single file <input type="file" name="file" data-obfo-cast />
          </label>
          <label>
            Multiple Files file
            <input type="file" name="files" multiple data-obfo-cast="files" />
          </label>
        </fieldset>
      </div>
      <button id="submit-button" type="submit" name="submit">Submit</button>
      <button
        id="submit-button"
        type="submit"
        name="submit"
        value="Submitted with Value"
      >
        Submit w/Val
      </button>
      <input
        alt="Submit with Image"
        type="image"
        name="submit"
        value="Submitted with Image"
        src="../logo.webp"
      />
    </form>
    <h2>On submit</h2>
    <pre id="output"></pre>
    <h2>Live, with <code>cast: "auto"</code> (observe)</h2>
    <pre id="live"></pre>
    <script type="module">
      // Serve the repo root (for example `npx serve .`) and open
      // /examples/demo.html: the import is relative to this file.
      import obfo, { observe } from "../index.mjs";
      const form = document.getElementById("test-form");
      const output = document.getElementById("output");
      const live = document.getElementById("live");
      // Files and Dates don't survive JSON.stringify; show their names.
      const show = (value) =>
        JSON.stringify(
          value,
          (key, v) =>
            v instanceof File ? `File(${v.name})` : v instanceof FileList ? [...v].map((f) => `File(${f.name})`) : v,
          " "
        );
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        // event.submitter is the button that was clicked; obfo reads it like an input.
        const object = obfo(form, { submit: event.submitter });
        console.log(object);
        output.textContent = show(object);
      });
      observe(form, (value) => (live.textContent = show(value)), {
        cast: "auto",
        immediate: true,
      });
    </script>
  </body>
</html>
